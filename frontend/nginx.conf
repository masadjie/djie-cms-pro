# Map social crawlers, Google News bot & search scrapers for server-rendered HTML preview
map $http_user_agent $is_social_crawler {
    default 0;
    ~*(facebookexternalhit|WhatsApp|Facebot|Twitterbot|TelegramBot|LinkedInBot|Discordbot|Slackbot|SkypeUriPreview|Google-Structured-Data-Testing-Tool|Googlebot-News|Googlebot|vkShare|W3C_Validator|redditbot|Applebot|Pinterest) 1;
}

# Block known malicious bot scanners, vulnerability probes & exploit kits
map $http_user_agent $is_bad_bot {
    default 0;
    ~*(nikto|sqlmap|acunetix|masscan|zgrab|nmap|dirbuster|gobuster|wprecon|jorgee|censys|shodan|python-requests|curl|wget|go-http-client|ZmEu|havij) 1;
}

# Rate Limiting & Concurrency Zones (Mitigate HTTP Flood & Slowloris DDoS)
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=addr_conn:10m;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # ── Performance & High Concurrency Tweaks ──────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;

    # Limit max simultaneous connections per IP (Blocks Slowloris & TCP Exhaustion)
    limit_conn addr_conn 50;

    # ── Security Hardening (Defense-in-Depth & ISO/IEC 27001) ───────────────
    # 1. Hide web server version from attackers
    server_tokens off;

    # 2. Block bad / malicious HTTP request methods
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$ ) {
        return 405;
    }

    # 3. Block malicious bot scrapers / automated pentest tools
    if ($is_bad_bot = 1) {
        return 403;
    }

    # 4. Block access to hidden files, git, env, backups, and configs
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(bak|conf|config|dist|fla|inc|ini|log|psd|sh|sql|sw[op]|yaml|yml)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 5. Comprehensive Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:;" always;

    # ── Payload & Buffer Limits (DDoS & Buffer Overflow Mitigation) ─────────
    client_max_body_size 100M;
    client_body_buffer_size 1M;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 32k;

    # ── Gzip Compression for Ultra-Fast TTFB & CWV ──────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_buffers 16 8k;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml
        application/javascript
        application/json
        application/xml+rss
        image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # ── Static Assets Caching (1 Year cache with immutable headers) ──────────
    location ~* \.(js|css|png|jpg|jpeg|webp|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── API Reverse Proxy (High Concurrency & Accurate Client IP) ────────────
    # NOTE: ^~ ensures nginx does NOT test regex (e.g. .webp, .png, .jpg) when URI starts with /api/
    location ^~ /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;

        # Keepalive connection pool to backend
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # Real Client IP propagation (Crucial for Rate Limiter & Audit Trail)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Buffer sizing for large payloads & responses
        proxy_buffers 16 64k;
        proxy_buffer_size 128k;
        proxy_busy_buffers_size 256k;
        proxy_temp_file_write_size 256k;

        # High concurrency timeouts (prevent premature 504 gateway timeout under load)
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # ── Dynamic SEO Endpoints (Sitemap, Google News Sitemap & RSS) ────────────
    location /sitemap.xml {
        proxy_pass http://backend:5000/api/v1/seo/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /sitemap-news.xml {
        proxy_pass http://backend:5000/api/v1/seo/sitemap-news.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /rss.xml {
        proxy_pass http://backend:5000/api/v1/seo/rss.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /robots.txt {
        proxy_pass http://backend:5000/api/v1/seo/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Social Media Crawler Handling for News Links (/berita/:slug) ─────────
    # Allows WhatsApp, Facebook, Twitter, Telegram, LinkedIn crawlers to get dynamic Open Graph og:image preview
    location ~* ^/berita/(?<article_slug>[^/?]+) {
        if ($is_social_crawler = 1) {
            proxy_pass http://backend:5000/api/v1/seo/share/berita/$article_slug;
        }
        try_files $uri $uri/ /index.html;
    }

    # ── SPA Fallback for React Router (Single Page Application) ───────────────
    # CRITICAL: index.html must NEVER be cached by browsers/CDN so users always fetch newest asset hashes!
    location / {
        limit_req zone=general_limit burst=30 nodelay;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
