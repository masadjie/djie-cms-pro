<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for PRO Badge -->
    <linearGradient id="djieBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    
    <!-- Gold / Amber Accent Gradient -->
    <linearGradient id="djieGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- BRAND TYPOGRAPHY: Djie CMS -->
  <text x="0" y="44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">
    Djie<tspan fill="#34d399" dx="5">CMS</tspan>
  </text>

  <!-- PRO BADGE PILL -->
  <g transform="translate(205, 14)">
    <rect x="0" y="0" width="76" height="34" rx="10" fill="url(#djieBadgeGrad)" stroke="#10b981" stroke-width="1.8" />
    <text x="38" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="900" fill="url(#djieGoldGrad)" text-anchor="middle" letter-spacing="2">
      PRO
    </text>
  </g>

  <!-- SUBTITLE: BKPSDM ACEH TAMIANG -->
  <text x="2" y="72" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#94a3b8" letter-spacing="3">
    BKPSDM ACEH TAMIANG
  </text>
</svg>
