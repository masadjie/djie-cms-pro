services:
  # ── 1. Database MySQL 8.0 ───────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: djie_cms_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: djie_cms_pro
      MYSQL_USER: djie_user
      MYSQL_PASSWORD: djie_password
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --innodb-log-file-size=64M
      --max-connections=200
    ports:
      - "3306:3306"
    volumes:
      - djie_cms_mysql_data:/var/lib/mysql
    networks:
      - djie_cms_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 2. Redis 7 Cache Layer ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: djie_cms_redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - djie_cms_redis_data:/data
    networks:
      - djie_cms_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 3. MinIO S3 Object Storage ──────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: djie_cms_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - djie_cms_minio_data:/data
    networks:
      - djie_cms_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 4. Backend API (Node.js + Express + Sequelize + Redis) ───────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: djie_cms_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: djie_cms_pro
      DB_USER: root
      DB_PASS: rootpassword
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadminpassword
      MINIO_BUCKET: djie-cms-storage
      JWT_SECRET: djie_cms_pro_super_secure_jwt_token_2026
      CLIENT_URL: http://localhost:3000
      CORS_ORIGIN: "*"
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - djie_cms_network

  # ── 5. Frontend (React 18 + Vite + Nginx) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: djie_cms_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - djie_cms_network

volumes:
  djie_cms_mysql_data:
  djie_cms_redis_data:
  djie_cms_minio_data:

networks:
  djie_cms_network:
    driver: bridge
