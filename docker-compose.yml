services:
  # ── 1. Database MySQL 8.0 (Single Node) ──────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: tamiang_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: layanan_acehtamiang
      MYSQL_USER: tamiang_user
      MYSQL_PASSWORD: tamiang_password
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --innodb-log-file-size=64M
      --sort-buffer-size=4M
      --join-buffer-size=4M
      --max-connections=200
      --slow-query-log=1
      --long-query-time=2
    ports:
      - "3316:3306"
    volumes:
      - mysql_tamiang_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - tamiang_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 2. Redis 7 Cache Layer ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tamiang_redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6388:6379"
    volumes:
      - redis_tamiang_data:/data
    networks:
      - tamiang_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 3. MinIO S3 Object Storage ────────────────────────────────────────────────
  minio:
    image: elestio/minio:latest
    container_name: tamiang_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
      MINIO_DRIVE_MIN_FREE_SPACE: "0"
      MINIO_STORAGE_CLASS_STANDARD: "EC:0"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_tamiang_data:/data
    networks:
      - tamiang_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 4. Backend API (Node.js + Express + Sequelize + Redis) ───────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tamiang_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: layanan_acehtamiang
      DB_USER: root
      DB_PASS: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadminpassword
      MINIO_BUCKET: djie-cms-attachments
      JWT_SECRET: tamiang_super_secret_jwt_key_2026_bkpsdm
      CLIENT_URL: https://bkpsdm.acehtamiangkab.go.id
      CORS_ORIGIN: "*"
      RATE_LIMIT_MAX: 50000
      RATE_LIMIT_WINDOW_MS: 900000
    ports:
      - "5055:5000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - tamiang_network

  # ── 5. Frontend (Vite + Nginx + Gzip + SEO Proxy) ────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tamiang_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - tamiang_network

volumes:
  mysql_tamiang_data:
  redis_tamiang_data:
  minio_tamiang_data:

networks:
  tamiang_network:
    driver: bridge
